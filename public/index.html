<!DOCTYPE html>
<html lang="es" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Buscador de sinónimos y antónimos en español usando la Free Dictionary API.">

    <title>Buscador de sinónimos y antónimos</title>

    <!-- Bootstrap 5.3.8 por CDN (versión fija para que la página no cambie sola) -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <!-- Abrir la conexión con la API antes de la primera búsqueda -->
    <link rel="preconnect" href="https://freedictionaryapi.com">

    <!-- Nuestros estilos van después para poder ajustar los de Bootstrap -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <a class="visually-hidden-focusable btn btn-primary position-absolute m-2" href="#palabra">
        Saltar al buscador
    </a>

    <main class="container py-4 py-md-5">

        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">

                <!-- Encabezado: título y botón de tema -->
                <header class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4">
                    <h1 class="h2 mb-0 titulo">Buscador de sinónimos y antónimos</h1>
                </header>

                <!-- Tarjeta principal con el formulario -->
                <div class="card shadow-sm mb-4">
                    <div class="card-body p-4">

                        <form id="formulario" novalidate>

                            <label for="palabra" class="form-label fw-semibold">Escribe una palabra:</label>

                            <div class="d-flex flex-column flex-sm-row gap-2">
                                <input
                                    type="text"
                                    id="palabra"
                                    class="form-control form-control-lg"
                                    placeholder="Ejemplo: feliz"
                                    autocomplete="off"
                                    maxlength="40"
                                    required
                                    aria-describedby="ayuda"
                                >

                                <button id="buscar" type="submit" class="btn btn-primary btn-lg px-4">
                                    <span id="spinner" class="spinner-border spinner-border-sm me-1" aria-hidden="true" hidden></span>
                                    <span id="textoBoton">Buscar</span>
                                </button>
                            </div>

                            <div id="ayuda" class="form-text">
                                Pulsa Enter para buscar. Haz clic en un sinónimo o antónimo para buscarlo.
                            </div>

                        </form>

                        <!-- Mensajes de estado: los lectores de pantalla los anuncian -->
                        <div id="mensaje" role="status" aria-live="polite" class="mt-3"></div>

                    </div>
                </div>

                <!-- Resultado -->
                <section id="resultado" class="card shadow-sm mb-4 tarjeta-resultado" hidden aria-labelledby="nombre">
                    <div class="card-body p-4">

                        <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
                            <h2 id="nombre" class="h3 mb-0 text-capitalize titulo"></h2>
                        </div>

                        <p id="definicion" class="text-body-secondary mb-4"></p>

                        <div class="row g-4">
                            <div class="col-12 col-md-6">
                                <h3 class="h5 subtitulo">
                                    Sinónimos <span id="contadorSinonimos" class="badge badge-sinonimo"></span>
                                </h3>
                                <ul id="sinonimos" class="list-unstyled d-flex flex-wrap gap-2 mb-0"></ul>
                            </div>

                            <div class="col-12 col-md-6">
                                <h3 class="h5 subtitulo">
                                    Antónimos <span id="contadorAntonimos" class="badge badge-antonimo"></span>
                                </h3>
                                <ul id="antonimos" class="list-unstyled d-flex flex-wrap gap-2 mb-0"></ul>
                            </div>
                        </div>

                    </div>
                </section>
            </div>
        </div>

    </main>

    <script type="module" src="script.mjs"></script>

</body>

</html>
